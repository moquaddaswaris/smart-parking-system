<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGradJS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="skinJS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9" />
      <stop offset="100%" stop-color="#d99b66" />
    </linearGradient>
    <clipPath id="circleClipJS">
      <circle cx="100" cy="100" r="96" />
    </clipPath>
  </defs>
  <circle cx="100" cy="100" r="98" fill="#1e1b4b" />
  <circle cx="100" cy="100" r="96" fill="url(#bgGradJS)" />
  <g clip-path="url(#circleClipJS)">
    <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    <!-- Shoulders / Jacket -->
    <path d="M40 210 C40 155, 65 145, 100 145 C135 145, 160 155, 160 210 Z" fill="#1e1b4b" />
    <path d="M70 155 L100 188 L130 155" fill="none" stroke="#f5d0a9" stroke-width="12" stroke-linecap="round" />
    <path d="M86 168 L100 192 L114 168 Z" fill="#ffffff" />
    <!-- Neck -->
    <rect x="88" y="115" width="24" height="35" rx="6" fill="url(#skinJS)" />
    <!-- Head -->
    <ellipse cx="100" cy="85" rx="33" ry="39" fill="url(#skinJS)" />
    <!-- Modern Side-Parted Hair -->
    <path d="M65 75 C63 46, 82 38, 102 38 C124 38, 137 48, 137 75 C128 65, 114 62, 98 62 C82 62, 72 67, 65 75 Z" fill="#18181b" />
    <path d="M68 62 C80 48, 110 50, 130 58 Z" fill="#27272a" />
    <!-- Ears -->
    <circle cx="67" cy="88" r="7" fill="url(#skinJS)" />
    <circle cx="133" cy="88" r="7" fill="url(#skinJS)" />
    <!-- Eyes -->
    <ellipse cx="88" cy="85" rx="3.8" ry="4.2" fill="#18181b" />
    <ellipse cx="112" cy="85" rx="3.8" ry="4.2" fill="#18181b" />
    <circle cx="89.5" cy="83.5" r="1.5" fill="#ffffff" />
    <circle cx="113.5" cy="83.5" r="1.5" fill="#ffffff" />
    <!-- Eyebrows -->
    <path d="M82 77 Q88 74 95 77" stroke="#18181b" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M105 77 Q112 74 118 77" stroke="#18181b" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Smile -->
    <path d="M92 105 Q100 113 108 105" fill="none" stroke="#9a5a2a" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>

